# Copy to 01-secret.yaml (git-ignored) and replace every placeholder:
#   cp k8s/01-secret.example.yaml k8s/01-secret.yaml
#
# Use letters and digits only for the passwords: they are inserted into
# connection URLs (postgresql://user:PASSWORD@...), where characters such as
# @ : / # would break parsing. Generate values with:
#   python3 -c "import secrets; print(secrets.token_hex(24))"   # passwords
#   python3 -c "import secrets; print(secrets.token_hex(32))"   # JWT key
#
# DATABASE_URL / REDIS_URL / RABBITMQ_URL are not set here: the manifests build
# them from these values and the in-cluster Service names.
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
  namespace: chat
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: change_this_postgres_password
  POSTGRES_DB: chat_db

  RABBITMQ_USER: admin
  RABBITMQ_PASSWORD: change_this_rabbitmq_password

  JWT_SECRET_KEY: generate_a_random_64_character_hex_string
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
