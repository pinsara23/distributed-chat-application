events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Log "$uri" (path only) instead of "$request": the WebSocket URL carries the
    # JWT in its query string (/ws/chat?token=...), which must not end up in logs.
    log_format chat '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log chat;

    # "Upgrade" for WebSocket handshakes, "close" for ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Hostnames are the docker compose service names. They are resolved once at
    # startup; compose restarts nginx when a chat server is recreated
    # (depends_on ... restart: true), so the addresses never go stale.
    upstream chat_cluster {
        server chat_server_1:8000 max_fails=3 fail_timeout=10s;
        server chat_server_2:8000 max_fails=3 fail_timeout=10s;
        server chat_server_3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        # Applies to every proxied location below.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket handshake. Set here (not only in /ws/) because nginx stops
        # inheriting proxy_set_header from the server block as soon as a
        # location sets its own. The map sends "close" for ordinary requests.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Skip a failed or unreachable server instead of returning an error.
        # (Non-idempotent requests such as POST are never retried by default.)
        proxy_next_upstream error timeout http_502 http_503;

        # REST API
        location / {
            proxy_pass http://chat_cluster;
            client_max_body_size 1m;
        }

        # WebSocket chat (/ws/chat). The Upgrade handshake headers come from the
        # server block; this location only adds long-lived-connection timeouts.
        location /ws/ {
            proxy_pass http://chat_cluster;

            # Clients ping every 10 s and the server drops silent sockets after
            # 45 s, so idle timeouts only need to be comfortably longer.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
